<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Pure Image Gallery | Heritage Moments</title>
  <!-- Font Awesome 6 (minimal icons for light controls) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* GALLERY SECTION - IMAGES ONLY, CLEAN & IMMERSIVE */
    .pure-image-gallery {
      background: #0a0a0a;
      min-height: 100vh;
      padding: 2rem 2rem 3rem;
      font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, sans-serif;
    }

    /* subtle header - minimal */
    .gallery-header-minimal {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .gallery-header-minimal h2 {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #e8e0d0;
      font-family: 'Times New Roman', serif;
      border-bottom: 1px solid rgba(200, 180, 140, 0.3);
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    /* filter pills - light/dark theme */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
    }

    .pill-img {
      background: rgba(30, 30, 35, 0.8);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(210, 180, 140, 0.4);
      padding: 0.6rem 1.6rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2d5c0;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pill-img i {
      font-size: 0.8rem;
      color: #c7a86b;
    }

    .pill-img:hover {
      background: #2a2a2e;
      border-color: #c7a86b;
      transform: translateY(-2px);
    }

    .pill-img.active {
      background: #c7a86b;
      color: #111;
      border-color: #c7a86b;
    }

    .pill-img.active i {
      color: #1e1a14;
    }

    /* search - minimal, fits dark theme */
    .search-area-img {
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .search-wrapper-img {
      display: flex;
      background: #1c1c1e;
      border-radius: 60px;
      border: 1px solid #3a332a;
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      transition: all 0.2s;
    }

    .search-wrapper-img input {
      flex: 1;
      padding: 0.8rem 1.5rem;
      border: none;
      font-size: 0.95rem;
      background: transparent;
      color: #f0e6d8;
      outline: none;
      font-family: monospace;
    }

    .search-wrapper-img input::placeholder {
      color: #8a7a64;
      font-family: system-ui;
    }

    .search-wrapper-img button {
      background: #2c2c30;
      border: none;
      padding: 0 1.5rem;
      color: #e0cbaa;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .search-wrapper-img button:hover {
      background: #c7a86b;
      color: #0a0a0a;
    }

    /* ----- PURE IMAGE GRID - NO TEXT, JUST VISUALS ----- */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
      margin-top: 0.5rem;
    }

    /* image card - completely focused on image, minimal overlay only for subtle epoch tag (optional but still non-intrusive) */
    /* To keep it "image only section", we display only image with a very subtle tag, but no description, no location, no details */
    .img-card {
      position: relative;
      background: #121212;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s;
      box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);
    }

    .img-card:hover {
      transform: scale(1.02);
      box-shadow: 0 20px 30px -8px black;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s;
    }

    /* minimal floating badge (epoch) - very subtle, doesn't clutter image-only experience */
    .img-epoch-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 500;
      color: #f0e0c4;
      letter-spacing: 0.3px;
      font-family: monospace;
      pointer-events: none;
      z-index: 2;
      border-left: 2px solid #c7a86b;
    }

    /* optional light overlay on hover to indicate click for full view */
    .img-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(transparent 50%, rgba(0,0,0,0.2));
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .img-card:hover::after {
      opacity: 0.4;
    }

    /* empty state - images only hint */
    .empty-image-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: #141414;
      border-radius: 48px;
      color: #b7a37c;
      border: 1px dashed #3c3328;
    }

    .empty-image-message i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    /* lightbox modal for full image view (pure image focus) */
    .lightbox-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.96);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.6);
      border: 2px solid rgba(210, 180, 140, 0.5);
    }

    .close-lightbox {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2.8rem;
      color: #e6d5b6;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
      font-weight: 300;
    }

    .close-lightbox:hover {
      transform: scale(1.1);
      color: #fff;
    }

    /* optional gallery footer note minimal */
    .gallery-footnote {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #5f5543;
      letter-spacing: 1px;
    }

    @media (max-width: 680px) {
      .pure-image-gallery {
        padding: 1rem 1rem 2rem;
      }
      .image-grid {
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .pill-img {
        padding: 0.4rem 1.2rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <!-- IMAGES ONLY GALLERY SECTION - no heritage descriptions, no location, no detailed cards, only visuals -->
  <div class="pure-image-gallery" id="imagesOnlyGallery">
    <div class="gallery-header-minimal">
      <h2><i class="fas fa-image"></i>  VISUAL CHRONICLES  <i class="fas fa-camera-retro"></i></h2>
    </div>

    <!-- filter pills: epoch & unesco (but only affects which images are shown) -->
    <div class="filter-row" id="imgFilterPills">
      <button class="pill-img active" data-filter="all"><i class="fas fa-th-large"></i> ALL IMAGES</button>
      <button class="pill-img" data-filter="ancient"><i class="fas fa-hourglass-half"></i> ANCIENT</button>
      <button class="pill-img" data-filter="medieval"><i class="fas fa-crown"></i> MEDIEVAL</button>
      <button class="pill-img" data-filter="early modern"><i class="fas fa-mosque"></i> EARLY MODERN</button>
      <button class="pill-img" data-filter="modern"><i class="fas fa-building"></i> MODERN</button>
      <button class="pill-img" data-filter="unesco"><i class="fas fa-uni"></i> UNESCO SITES</button>
    </div>

    <!-- minimal search (by name / location / style) to filter images -->
    <div class="search-area-img">
      <div class="search-wrapper-img">
        <input type="text" id="imageSearchInput" placeholder="🔍  filter images by name, place or style..." autocomplete="off">
        <button id="imageSearchBtn"><i class="fas fa-search"></i></button>
      </div>
    </div>

    <!-- PURE IMAGE GRID - only images with tiny epoch badge (optional but keeps clean) -->
    <div class="image-grid" id="imageGridContainer"></div>
    <div class="gallery-footnote">
      <i class="fas fa-expand"></i> click any image for fullscreen view
    </div>
  </div>

  <!-- LIGHTBOX MODAL - full image focus -->
  <div id="imageLightbox" class="lightbox-modal">
    <button class="close-lightbox" id="closeLightboxBtn">&times;</button>
    <img class="lightbox-img" id="lightboxImg" alt="full heritage visual">
  </div>

  <script>
    (function() {
      // ---------- IMAGES ONLY DATA: all heritage sites but we extract only the image, name, epoch, unesco flag, location, style (for filtering) ----------
      // we keep minimal metadata for filtering, but UI shows only images
      const heritageImageData = [
        {
          name: "Sidi Saiyyed Mosque",
          location: "Ahmedabad, Gujarat",
          image: "images/sidi saiyad ni jali.png",
          epoch: "medieval",
          unesco: true,
          style: "Indo-Islamic Architecture"
        },
        {
          name: "Adalaj Stepwell",
          location: "Adalaj, Gujarat",
          image: "images/adalaj step well.jpg",
          epoch: "medieval",
          unesco: false,
          style: "Solanki and Indo-Islamic Architecture"
        },
        {
          name: "Rani ki Vav",
          location: "Patan, Gujarat",
          image: "images/rani ni vaav.png",
          epoch: "medieval",
          unesco: true,
          style: "Maru-Gurjara (Solanki) Architecture"
        },
        {
          name: "Dwarkadhish Temple",
          location: "Dwarka, Gujarat",
          image: "images/Dwarkadhis temple.png",
          epoch: "ancient",
          unesco: false,
          style: "Chalukya Temple Architecture"
        },
        {
          name: "Uparkot Fort",
          location: "Junagadh, Gujarat",
          image: "images/uprkort fort.png",
          epoch: "ancient",
          unesco: false,
          style: "Ancient Indian Fort Architecture"
        },
        {
          name: "Ashoka Rock Edicts",
          location: "Junagadh, Gujarat",
          image: "images/Ashoka_Rock_Edict_at_Junagadh.jpg",
          epoch: "ancient",
          unesco: false,
          style: "Mauryan Inscriptional Rock Architecture"
        },
        {
          name: "Jama Masjid (Champaner)",
          location: "Champaner, Gujarat",
          image: "images/sarangib-jama-masjid-4009599_1920.jpg",
          epoch: "medieval",
          unesco: true,
          style: "Indo-Islamic Architecture"
        },
        {
          name: "Pavagadh Hill",
          location: "Panchmahal, Gujarat",
          image: "images/pavagadh.jpg",
          epoch: "ancient",
          unesco: true,
          style: "Traditional Hindu Temple Architecture"
        },
        {
          name: "Aina Mahal",
          location: "Bhuj, Gujarat",
          image: "images/Aina_mahal.jpg_01.jpg",
          epoch: "early modern",
          unesco: false,
          style: "Indo-European Architecture"
        },
        {
          name: "Prag Mahal",
          location: "Bhuj, Gujarat",
          image: "images/pexels-sunny-prajapati-229756129-20312821.jpg",
          epoch: "modern",
          unesco: false,
          style: "Italian Gothic Architecture"
        }
      ];

      // DOM elements
      const gridContainer = document.getElementById('imageGridContainer');
      const filterButtons = document.querySelectorAll('#imgFilterPills .pill-img');
      const searchInput = document.getElementById('imageSearchInput');
      const searchBtn = document.getElementById('imageSearchBtn');
      const lightbox = document.getElementById('imageLightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const closeLightbox = document.getElementById('closeLightboxBtn');

      let currentImageFilter = 'all';
      let imageSearchTerm = '';

      // helper: render images only grid (no description, no long text, no location, only images + minimal epoch badge)
      function renderImageGrid() {
        // filter by epoch / unesco / all
        let filteredImages = heritageImageData.filter(item => {
          if (currentImageFilter !== 'all') {
            if (currentImageFilter === 'unesco') {
              if (!item.unesco) return false;
            } else {
              // match epoch exactly (ancient, medieval, early modern, modern)
              if (item.epoch !== currentImageFilter) return false;
            }
          }
          // apply search term filter (by name, location or style)
          if (imageSearchTerm.trim() !== '') {
            const term = imageSearchTerm.toLowerCase();
            return item.name.toLowerCase().includes(term) ||
                   item.location.toLowerCase().includes(term) ||
                   (item.style && item.style.toLowerCase().includes(term));
          }
          return true;
        });

        if (filteredImages.length === 0) {
          gridContainer.innerHTML = `
            <div class="empty-image-message">
              <i class="fas fa-images"></i>
              <h3 style="margin-top: 12px; font-weight: 400;">no images match</h3>
              <p style="margin-top: 8px;">try different filter or search keyword</p>
            </div>
          `;
          return;
        }

        let imagesHTML = '';
        filteredImages.forEach(imgItem => {
          // epoch display text for badge (minimal)
          let epochLabel = imgItem.epoch.charAt(0).toUpperCase() + imgItem.epoch.slice(1);
          if (currentImageFilter === 'unesco' && imgItem.unesco) epochLabel = 'UNESCO';
          // building the image card: absolutely no text except tiny badge (which is image context but doesn't break 'image only' purpose)
          // but we keep the badge optional — it's just a tiny identifier, no paragraphs, no location, no description
          imagesHTML += `
            <div class="img-card" data-img-url="${imgItem.image}" data-name="${imgItem.name.replace(/"/g, '&quot;')}" data-epoch="${imgItem.epoch}">
              <img src="${imgItem.image}" alt="${imgItem.name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x400/2a241e/c7a86b?text=Image+Not+Found';">
              <div class="img-epoch-badge"><i class="fas fa-tag"></i> ${epochLabel}</div>
            </div>
          `;
        });
        gridContainer.innerHTML = imagesHTML;

        // attach click event to each image card for lightbox (full image view)
        document.querySelectorAll('.img-card').forEach(card => {
          card.addEventListener('click', (e) => {
            // prevent if clicked on badge or inner but we capture whole card
            const imgElement = card.querySelector('img');
            if (imgElement && imgElement.src) {
              let highResUrl = imgElement.src;
              // if placeholder image appears, we still show but it's fine
              lightboxImg.src = highResUrl;
              lightbox.classList.add('active');
            } else {
              // fallback to data attribute
              const dataUrl = card.getAttribute('data-img-url');
              if (dataUrl) lightboxImg.src = dataUrl;
              else lightboxImg.src = 'https://placehold.co/800x600/2c241e/c7a86b?text=preview';
              lightbox.classList.add('active');
            }
          });
        });
      }

      // update active filter style
      function setImageFilter(filterValue) {
        currentImageFilter = filterValue;
        filterButtons.forEach(btn => {
          const btnVal = btn.getAttribute('data-filter');
          if (btnVal === filterValue) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        renderImageGrid();
      }

      // filter pills event
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const newFilter = btn.getAttribute('data-filter');
          setImageFilter(newFilter);
        });
      });

      // search function
      function performImageSearch() {
        imageSearchTerm = searchInput.value;
        renderImageGrid();
      }

      searchBtn.addEventListener('click', performImageSearch);
      searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') performImageSearch();
      });

      // lightbox close handlers
      function closeLightboxModal() {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
      }

      closeLightbox.addEventListener('click', closeLightboxModal);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightboxModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          closeLightboxModal();
        }
      });

      // initial render: images only
      renderImageGrid();
    })();
  </script>
</body>
</html>
